name: Go

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  push:
    branches:
      - main

jobs:
  testing:
    name: "Unit Testing"
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Clone repository"
        uses: actions/checkout@v4
      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          # The same version the release workflow builds the binaries with.
          go-version: stable
      - name: "Perform Unit Test"
        run: "go test -v ./..."
      - name: "Build and Install"
        run: |
          go build -v ./...
          go install -v ./...
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
